<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Find Solace — Flathead Valley, Montana</title>
<meta name="description" content="Private coordination for the Flathead Valley.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    font-family: 'Inter', sans-serif;
    color: #EFE5CC;
    min-height: 100dvh;
    position: relative;
    overflow-x: hidden;
  }

  /* Background image */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
  }
  .bg img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center 40%;
  }
  .bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(10,10,10,0.5) 0%,
      rgba(10,10,10,0.65) 35%,
      rgba(10,10,10,0.82) 65%,
      rgba(10,10,10,0.93) 100%
    );
  }

  /* Content */
  .content {
    position: relative;
    z-index: 1;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2.5rem 2rem;
  }

  .top-bar {
    font-weight: 200;
    font-size: 0.45rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: rgba(239,229,204,0.3);
    margin-bottom: 2rem;
  }

  .headline {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(2.2rem, 8vw, 3.2rem);
    color: #EFE5CC;
    margin-bottom: 0.5rem;
    text-align: center;
    line-height: 1.15;
  }

  .sub {
    font-weight: 300;
    font-size: 0.75rem;
    color: rgba(239,229,204,0.4);
    letter-spacing: 0.06em;
    text-align: center;
    line-height: 1.6;
    max-width: 280px;
    margin-bottom: 2rem;
  }

  .card {
    width: 100%;
    max-width: 320px;
  }

  /* Contact buttons */
  .contact-row { margin-bottom: 0.5rem; }
  .contact-row a {
    display: block;
    font-weight: 300;
    font-size: 0.85rem;
    color: #EFE5CC;
    text-decoration: none;
    padding: 13px 0;
    border: 1px solid rgba(239,229,204,0.09);
    background: rgba(10,10,10,0.3);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    text-align: center;
    transition: all 0.2s ease;
    letter-spacing: 0.04em;
  }
  .contact-row a:active {
    background: rgba(201,169,97,0.1);
    border-color: rgba(201,169,97,0.3);
  }
  .contact-label {
    font-size: 0.42rem;
    font-weight: 200;
    text-transform: uppercase;
    letter-spacing: 0.35em;
    color: rgba(239,229,204,0.28);
    display: block;
    margin-bottom: 2px;
  }

  /* Save Contact — gold button */
  .save-btn {
    display: block;
    width: 100%;
    padding: 15px 0;
    margin-top: 0.75rem;
    background: #C9A961;
    color: #0A0A0A;
    border: none;
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 0.6rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
  }
  .save-btn:active { opacity: 0.85; }

  /* Three link boxes */
  .links {
    display: flex;
    gap: 0;
    margin-top: 1rem;
    width: 100%;
    max-width: 320px;
  }
  .link-box {
    flex: 1;
    display: block;
    text-decoration: none;
    text-align: center;
    padding: 13px 6px;
    border: 1px solid rgba(239,229,204,0.06);
    background: rgba(10,10,10,0.2);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: all 0.2s ease;
  }
  .link-box + .link-box { border-left: none; }
  .link-box:active { background: rgba(201,169,97,0.06); }
  .link-box-label {
    font-size: 0.38rem;
    font-weight: 200;
    text-transform: uppercase;
    letter-spacing: 0.25em;
    color: rgba(239,229,204,0.25);
    display: block;
    margin-bottom: 2px;
  }
  .link-box-name {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 0.78rem;
    color: rgba(239,229,204,0.75);
  }
  .link-box-url {
    font-size: 0.4rem;
    font-weight: 200;
    letter-spacing: 0.06em;
    color: rgba(201,169,97,0.45);
    display: block;
    margin-top: 2px;
  }

  .footer {
    margin-top: 1.75rem;
    font-weight: 200;
    font-size: 0.42rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(239,229,204,0.12);
  }

  @media (max-width: 360px) {
    .headline { font-size: 2rem; }
    .content { padding: 2rem 1.5rem; }
    .links { flex-direction: column; }
    .link-box + .link-box { border-left: 1px solid rgba(239,229,204,0.06); border-top: none; }
  }

  @media (max-height: 680px) {
    .top-bar { margin-bottom: 1.25rem; }
    .sub { margin-bottom: 1.25rem; }
    .footer { margin-top: 1rem; }
  }
</style>
</head>
<body>

<div class="bg">
  <img src="https://pub.hyperagent.com/api/published/pbf01KRF44BBT_S4F69D0W5MH4XFCW/img_hero_terrace.png" alt="">
</div>

<div class="content">

  <div class="top-bar">Private Coordination · Flathead Valley · Montana</div>

  <h1 class="headline">Find solace.</h1>
  <p class="sub">Every detail considered. Every arrangement, seamless.</p>

  <div class="card">
    <div class="contact-row">
      <a href="tel:+14062136887">
        <span class="contact-label">Call</span>
        (406) 213-6887
      </a>
    </div>
    <div class="contact-row">
      <a href="mailto:contact@solaceconcierge.com">
        <span class="contact-label">Email</span>
        contact@solaceconcierge.com
      </a>
    </div>

    <!-- Save Contact — downloads vCard with Solace logo as contact photo -->
    <a class="save-btn" href="https://pub.hyperagent.com/api/published/pbf01KY8Y7GYH_R4VSCQ1W488VP1HD/solace.vcf" download="Solace Concierge.vcf">Save Contact</a>
  </div>

  <!-- Three destinations -->
  <div class="links">
    <a class="link-box" href="https://solacemontana.com" target="_blank" rel="noopener noreferrer">
      <span class="link-box-label">Website</span>
      <span class="link-box-name">Explore</span>
      <span class="link-box-url">solacemontana.com</span>
    </a>
    <a class="link-box" href="https://solacemt.com" target="_blank" rel="noopener noreferrer">
      <span class="link-box-label">App</span>
      <span class="link-box-name">Request</span>
      <span class="link-box-url">solacemt.com</span>
    </a>
    <a class="link-box" href="https://hyperagent.com/s/rPmFieIYxor3unXpai7cnw" target="_blank" rel="noopener noreferrer">
      <span class="link-box-label">Pricing</span>
      <span class="link-box-name">Details</span>
      <span class="link-box-url">how it works</span>
    </a>
  </div>

  <div class="footer">Solace Concierge LLC</div>

</div>

</body>
</html>
