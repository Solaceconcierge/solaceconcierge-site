name: Notify search engines after deployment

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  indexnow:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify IndexNow of public pages
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/Solaceconcierge/solaceconcierge-site/${DEPLOYED_SHA}/.github/scripts/notify_indexnow.py" \
            --output /tmp/solace-notify-indexnow.py
          python3 /tmp/solace-notify-indexnow.py
