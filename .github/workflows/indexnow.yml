name: Notify search engines after deployment

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'sitemap.xml'
      - '38c1e28a8539c38195bf2c72b71a6f13.txt'
      - '.github/scripts/notify_indexnow.py'
      - '.github/workflows/indexnow.yml'

permissions:
  contents: read

jobs:
  indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for this revision to deploy
        env:
          DEPLOYED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          url = "https://api.github.com/repos/Solaceconcierge/solaceconcierge-site/actions/runs?head_sha=" + os.environ["DEPLOYED_SHA"] + "&per_page=20"
          for attempt in range(24):
              request = urllib.request.Request(url, headers={"User-Agent": "SOLACE-IndexNow/1.0"})
              with urllib.request.urlopen(request, timeout=20) as response:
                  runs = json.load(response)["workflow_runs"]
              pages = [run for run in runs if run["name"] == "pages build and deployment"]
              if pages and pages[0]["status"] == "completed":
                  if pages[0]["conclusion"] != "success":
                      raise SystemExit("Pages deployment did not succeed; no URLs submitted.")
                  print("Pages deployment succeeded.")
                  break
              time.sleep(10)
          else:
              raise SystemExit("Pages deployment not complete; no URLs submitted.")
          PY
      - name: Notify IndexNow of public pages
        env:
          DEPLOYED_SHA: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/Solaceconcierge/solaceconcierge-site/${DEPLOYED_SHA}/.github/scripts/notify_indexnow.py" \
            --output /tmp/solace-notify-indexnow.py
          python3 /tmp/solace-notify-indexnow.py
